services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: life-api-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${LIFEAPI_SQL_PASSWORD:?Set LIFEAPI_SQL_PASSWORD before running Docker Compose}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - life-api-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: ops/DockerFile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - Logging__LogLevel__Life.Api=Debug
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LifeApiDb;User Id=sa;Password=${LIFEAPI_SQL_PASSWORD:?Set LIFEAPI_SQL_PASSWORD before running Docker Compose};TrustServerCertificate=true;MultipleActiveResultSets=true;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - life-api-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - api
    networks:
      - life-api-network

volumes:
  sqlserver_data:

networks:
  life-api-network:
    driver: bridge