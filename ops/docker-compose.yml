version: '3.8'
services:
  life-api:
    build:
      context: ..
      dockerfile: ops/DockerFile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - Logging__LogLevel__Life.Api=Debug